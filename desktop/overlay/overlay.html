<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcana Helper overlay</title>
<style>
  /* Drawn over the game window. The marks never take clicks; the two guides take the mouse only while it is over them
     (so they can be dragged or closed), everything else goes to the game. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #marks { position: absolute; inset: 0; pointer-events: none; }
  .mark { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; font-weight: 800; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.9); pointer-events: none; }
  .mark.fix { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #ffcc55; color: #ffcc55; background: rgba(40, 24, 0, .55); font-size: 15px; box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 18px rgba(255,204,85,.75); animation: pulse 1.3s ease-in-out infinite; }
  .mark.num { width: 22px; height: 16px; border-radius: 4px; background: rgba(10, 8, 22, .75); color: #e8e0f8; font-size: 11px; font-weight: 700; margin-left: 30px; margin-top: 14px; animation: none; box-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .mark.go { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #58e08c; color: #58e08c; background: rgba(0, 30, 10, .35); font-size: 15px; box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 24px rgba(88,224,140,.85); animation: pulse 1.6s ease-in-out infinite; }
  /* the card to play (or the refill die): a green frame round it, the word above */
  .mark.gocard { border: 4px solid #58e08c; border-radius: 10px; background: rgba(88, 224, 140, .12); box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 26px rgba(88,224,140,.9); animation: glow 1.4s ease-in-out infinite; }
  .mark.gocard b { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; background: #58e08c; color: #06210f; font-size: 14px; font-weight: 800; padding: 2px 8px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.6); text-shadow: none; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 14px rgba(88,224,140,.6); } 50% { box-shadow: 0 0 0 2px rgba(0,0,0,.6), 0 0 30px rgba(88,224,140,1); } }
  @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.12); } }

  /* where the board belongs: gold outlines of its 20 tile holes, an arrow from where it is, and a banner */
  #align { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #align .home { fill: rgba(255, 204, 85, .10); stroke: #ffcc55; stroke-width: 2.5; stroke-dasharray: 7 5; filter: drop-shadow(0 0 4px rgba(0,0,0,.9)); }
  #align.done .home { stroke: #58e08c; fill: rgba(88, 224, 140, .14); stroke-dasharray: none; }
  #align .cur { fill: none; stroke: rgba(255, 120, 120, .85); stroke-width: 2; }
  #align .arrow { stroke: #ffcc55; stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }
  #align .arrowhead { fill: #ffcc55; }
  #alignMsg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(40, 24, 0, .92); border: 2px solid #ffcc55; color: #ffe2a0; border-radius: 12px; padding: 8px 16px; font-size: 15px; font-weight: 600; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.6); pointer-events: none; max-width: 70%; }
  #alignMsg small { display: block; font-weight: 400; font-size: 12px; color: #e8d3a8; margin-top: 2px; }
  #alignMsg.done { border-color: #58e08c; color: #b8f5cc; background: rgba(0, 30, 10, .9); }
  #alignMsg[hidden], #align[hidden] { display: none; }
  /* the reminder at the top of the game: "choose a special board if it procs" (below the board message when both show) */
  #hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(10, 8, 22, .92); border: 2px solid #c9a5ff; color: #ecdcff; border-radius: 12px; padding: 8px 16px; font-size: 15px; font-weight: 600; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.6); pointer-events: none; max-width: 70%; }
  #hint.under { top: 70px; }
  #hint[hidden] { display: none; }
  #toast { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); background: rgba(10, 8, 22, .92); border: 2px solid #58e08c; color: #b8f5cc; border-radius: 12px; padding: 8px 16px; font-size: 15px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.6); pointer-events: none; }
  #toast[hidden] { display: none; }
  .sheet { position: absolute; max-height: calc(100% - 16px); overflow: hidden; background: rgba(10, 8, 22, .9); border: 1px solid rgba(232, 200, 120, .55); border-radius: 12px; color: #ece6f6; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .sheet[hidden] { display: none; }
  .sheet .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; cursor: grab; background: rgba(232, 200, 120, .1); border-bottom: 1px solid rgba(232, 200, 120, .25); }
  .sheet.dragging .bar { cursor: grabbing; }
  .sheet .bar h2 { margin: 0; flex: 1; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #e8c878; }
  .sheet .bar .grip { color: rgba(232, 200, 120, .6); font-size: 13px; letter-spacing: -2px; }
  .sheet .bar button { all: unset; cursor: pointer; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; color: #cfc6e0; font-size: 15px; }
  .sheet .bar button:hover { background: rgba(255,255,255,.12); color: #fff; }
  .sheet .body { padding: 8px 12px 10px; display: grid; gap: 6px; }
  .sheet h3 { margin: 4px 0 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #b9a6e8; font-weight: 600; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 4px 6px; }
  .it { display: grid; justify-items: center; gap: 2px; text-align: center; line-height: 1.15; }
  .it img { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
  .it span { color: #cfc6e0; font-size: 11px; }
  .it b { color: #fff; font-weight: 600; }
  .note { color: #a89fc0; font-size: 11px; }
  .note kbd { font: 600 10px/1 "Segoe UI", sans-serif; padding: 2px 4px; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; color: #fff; }

  /* the card guide: the top of each card, as the hand shows it */
  #legend { width: 300px; }
  #cards { width: 430px; }
  .cardrow { display: grid; grid-template-columns: 74px repeat(6, 1fr); gap: 4px; align-items: center; }
  .lab { color: #fff; font-weight: 600; line-height: 1.15; }
  .lab span { display: block; color: #a89fc0; font-weight: 400; font-size: 10px; }
  .c { display: grid; justify-items: center; gap: 1px; }
  .c img { width: 44px; height: 54px; object-fit: cover; object-position: top; border-radius: 4px; border: 1px solid rgba(0,0,0,.6); }
  .c i { font-style: normal; color: #ece6f6; font-size: 11px; font-weight: 600; }
  .ups { display: grid; grid-template-columns: 74px repeat(3, 1fr); gap: 4px; align-items: center; }
  .ups .head { color: #a89fc0; font-size: 10px; text-align: center; }
  .ups .c img { width: 40px; height: 40px; }
  .choose { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .choose .c b { color: #fff; font-size: 11px; font-weight: 600; text-align: center; line-height: 1.1; }
  .choose .c span { color: #a89fc0; font-size: 10px; }
</style>
</head>
<body>

</div>
